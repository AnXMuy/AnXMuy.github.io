<script src="assets/js/main.min.js"></script>
<script>
  (function () {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let isNavigating = false;

    function getContentPanel() {
      return document.querySelector('article.page');
    }

    function animatePageEnter() {
      const contentPanel = getContentPanel();
      if (prefersReducedMotion || !contentPanel) return;
      contentPanel.classList.add('page-enter');
      requestAnimationFrame(function () {
        contentPanel.classList.add('page-enter-active');
      });
      setTimeout(function () {
        contentPanel.classList.remove('page-enter');
        contentPanel.classList.remove('page-enter-active');
      }, 360);
    }

    function initReveal() {
      const revealElements = document.querySelectorAll('.page-reveal');
      if ('IntersectionObserver' in window && revealElements.length) {
        const revealObserver = new IntersectionObserver(function (entries, observer) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          });
        }, { threshold: 0.14 });
        revealElements.forEach(function (element) {
          revealObserver.observe(element);
        });
      } else {
        revealElements.forEach(function (element) {
          element.classList.add('is-visible');
        });
      }
    }

    function initEmailCopy() {
      const emailText = document.getElementById('emailText');
      if (!emailText || emailText.dataset.bound === '1') return;
      emailText.dataset.bound = '1';
      emailText.addEventListener('click', function () {
        const email = this.getAttribute('data-email');
        navigator.clipboard.writeText(email).then(() => {
          const originalText = this.textContent;
          this.textContent = 'Copied';
          this.classList.add('copied');
          setTimeout(() => {
            this.textContent = originalText;
            this.classList.remove('copied');
          }, 1400);
        }).catch(() => {
          alert('Copy failed, please copy manually: ' + email);
        });
      });
    }

    async function softNavigate(targetUrl, shouldPushState) {
      const contentPanel = getContentPanel();
      if (!contentPanel || isNavigating) {
        window.location.href = targetUrl.href;
        return;
      }
      isNavigating = true;

      if (!prefersReducedMotion) {
        contentPanel.classList.add('page-leave-left');
        await new Promise(function (resolve) { setTimeout(resolve, 220); });
      }

      try {
        const response = await fetch(targetUrl.href, { headers: { 'X-Requested-With': 'fetch' } });
        if (!response.ok) throw new Error('failed to load target page');
        const html = await response.text();
        const parser = new DOMParser();
        const targetDoc = parser.parseFromString(html, 'text/html');
        const newPanel = targetDoc.querySelector('article.page');
        if (!newPanel) throw new Error('target content panel not found');

        contentPanel.replaceWith(newPanel);
        document.title = targetDoc.title || document.title;
        if (shouldPushState) {
          history.pushState({}, '', targetUrl.href);
        }
        window.scrollTo({ top: 0, behavior: 'auto' });

        initEmailCopy();
        initReveal();
        animatePageEnter();
      } catch (error) {
        window.location.href = targetUrl.href;
      } finally {
        isNavigating = false;
      }
    }

    document.addEventListener('click', function (event) {
      const link = event.target.closest('a[data-page-transition="slide-left"]');
      if (!link) return;
      if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;

      const href = link.getAttribute('href');
      if (!href || href.startsWith('#')) return;
      const targetUrl = new URL(href, window.location.href);
      if (targetUrl.origin !== window.location.origin) return;

      const samePath = targetUrl.pathname === window.location.pathname;
      if (samePath) return;

      event.preventDefault();
      softNavigate(targetUrl, true);
    });

    window.addEventListener('popstate', function () {
      softNavigate(new URL(window.location.href), false);
    });

    initEmailCopy();
    initReveal();
    animatePageEnter();
  })();
</script>
