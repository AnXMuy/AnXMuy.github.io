<script src="assets/js/main.min.js"></script>
<script>
  (function () {
    const body = document.body;
    if (!body) return;

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!prefersReducedMotion) {
      body.classList.add('page-enter');
      requestAnimationFrame(function () {
        body.classList.add('page-enter-active');
      });
      setTimeout(function () {
        body.classList.remove('page-enter');
        body.classList.remove('page-enter-active');
      }, 420);
    }

    const transitionLinks = document.querySelectorAll('a[data-page-transition="slide-left"]');
    transitionLinks.forEach(function (link) {
      link.addEventListener('click', function (event) {
        if (
          event.defaultPrevented ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey ||
          event.button !== 0
        ) {
          return;
        }

        const href = link.getAttribute('href');
        if (!href || href.startsWith('#')) return;

        const targetUrl = new URL(href, window.location.href);
        if (targetUrl.origin !== window.location.origin) return;
        if (targetUrl.href === window.location.href) return;

        event.preventDefault();
        body.classList.add('page-leave-left');
        setTimeout(function () {
          window.location.href = targetUrl.href;
        }, 320);
      });
    });

    const revealElements = document.querySelectorAll('.page-reveal');
    if ('IntersectionObserver' in window && revealElements.length) {
      const revealObserver = new IntersectionObserver(function (entries, observer) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.14 });

      revealElements.forEach(function (element) {
        revealObserver.observe(element);
      });
    } else {
      revealElements.forEach(function (element) {
        element.classList.add('is-visible');
      });
    }
  })();
</script>
